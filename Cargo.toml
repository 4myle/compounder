[package]
description = "Calculate CAGR and date difference"
name = "compounder"
authors = ["Roger Salomonsson <medicorab@gmail.com>"]
version = "1.1.0"
edition = "2021"

# [[bin]]
# name = "compounder"
# path = "src/main.rs"

[dependencies]
eframe = { version = "0.35.0", default-features = false, features = ["glow", "persistence"] }
chrono = { version = "0.4.45", features = ["serde"] }
serde  = { version = "1.0.229" }
# egui_extras = { version = "0.29.1", features = ["svg"] }

[build-dependencies]
winresource = "0.1.31"

[profile.dev]
debug = 2
opt-level = 0
# split-debuginfo = "unpacked"

[profile.dev.package."*"]
debug = 1
opt-level = 3

[profile.release]
debug = 0
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = "symbols"

[lints.rust]
unsafe_code = "deny"

[lints.clippy]
pedantic = "deny"
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
